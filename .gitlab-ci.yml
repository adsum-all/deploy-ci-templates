# Minimal pipeline for ADSUM. Delegates to the shared CI templates in
# sr-media-ai/adsum/deployment/ci-templates (Constitution audit and stack jobs).
include:
  - project: 'sr-media-ai/adsum/deployment/ci-templates'
    ref: main
    file:
      - '/templates/base.yml'
      # Les deux politiques d'acces vivent ici : c'est donc ici que leur
      # forme, leur coherence et la disjonction des deux mondes sont verifiees.
      - '/templates/policies.yml'
