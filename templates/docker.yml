# Reusable Docker build and push to the GitLab container registry, using the
# official Docker engine (docker build) with Docker-in-Docker on the default
# GitLab.com shared runners.
#
# Root cause of earlier failures and the fix:
#  - With a runner tag (gitlab-org-docker) no runner picked up the job (those
#    runners are reserved), so jobs failed with no runner.
#  - On the default shared runners the dind service must be started explicitly
#    in non-TLS mode, otherwise the daemon was never reachable. The service
#    command ["--tls=false"] plus DOCKER_HOST tcp://docker:2375 makes the
#    official Docker engine work without tags and without TLS cert sharing.
#
# The including repo must define a 'build' stage and may set:
#   DOCKERFILE_PATH  (default deploy/Dockerfile)
#
# Tags pushed:
#   dev:<sha>, dev:latest    on the develop branch
#   prod:X.Y.Z, prod:latest  on a tag vX.Y.Z

.docker:
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKERFILE_PATH: "deploy/Dockerfile"
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; echo "waiting for docker daemon $i/30"; sleep 2; done
    - docker info >/dev/null 2>&1 || { echo "docker daemon not reachable"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:dev:
  extends: .docker
  stage: build
  script:
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f "${DOCKERFILE_PATH}"
      -t "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
      -t "${CI_REGISTRY_IMAGE}/dev:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}/dev:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build:prod:
  extends: .docker
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="${VERSION}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f "${DOCKERFILE_PATH}"
      -t "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
      -t "${CI_REGISTRY_IMAGE}/prod:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
    - docker push "${CI_REGISTRY_IMAGE}/prod:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
