# Reusable Docker build and push to the GitLab container registry, using the
# official Docker engine with Docker-in-Docker on the GitLab.com SaaS runners.
#
# Root cause of earlier failures and the fix (verified):
#  - The adsum group has a self-hosted runner (sr-media-runner-prod-01) with
#    run_untagged = true and privileged = false. It intercepted the untagged
#    Docker jobs, and without privileged its dind daemon never started.
#  - The SaaS shared runners DO support dind (the moodle project builds on
#    saas-linux-small-amd64 successfully). Pinning the build jobs to that SaaS
#    runner tag avoids the self-hosted runner and runs dind where it works.
#  - This is the moodle configuration, with an explicit SaaS tag so the
#    self-hosted runner does not grab the job. No runner change is needed.
#
# The image is portable (GitLab registry) and deployable on any target.
#
# The including repo must define a 'build' stage and may set:
#   DOCKERFILE_PATH  (default deploy/Dockerfile)

.docker:
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - saas-linux-small-amd64
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKERFILE_PATH: "deploy/Dockerfile"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:dev:
  extends: .docker
  stage: build
  script:
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f "${DOCKERFILE_PATH}"
      -t "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
      -t "${CI_REGISTRY_IMAGE}/dev:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}/dev:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build:prod:
  extends: .docker
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="${VERSION}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f "${DOCKERFILE_PATH}"
      -t "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
      -t "${CI_REGISTRY_IMAGE}/prod:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
    - docker push "${CI_REGISTRY_IMAGE}/prod:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
