# Reusable Docker build and push to the GitLab container registry, using the
# official Docker engine on the self-hosted group runner (tag: docker), which
# has Docker installed on the host.
#
# Root cause of earlier failures and the fix:
#  - The shared SaaS runners do not start a privileged dind service, so the
#    Docker daemon was never reachable; the dedicated dind shared runners
#    (gitlab-org-docker) are reserved and never picked up the jobs.
#  - The group has a self-hosted runner (tag 'docker') with Docker on the host.
#    Targeting it and using the host Docker daemon directly (no dind, no
#    DOCKER_HOST override) makes the official Docker engine work reliably.
#
# The image produced is portable: it lives in the GitLab registry and can be
# deployed on any target (Vercel, any VM), so nothing is locked to one provider.
#
# The including repo must define a 'build' stage and may set:
#   DOCKERFILE_PATH  (default deploy/Dockerfile)

.docker:
  image: docker:27
  tags:
    - docker
  variables:
    DOCKERFILE_PATH: "deploy/Dockerfile"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:dev:
  extends: .docker
  stage: build
  script:
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="dev-${CI_COMMIT_SHORT_SHA}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f "${DOCKERFILE_PATH}"
      -t "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
      -t "${CI_REGISTRY_IMAGE}/dev:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/dev:${CI_COMMIT_SHORT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}/dev:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

build:prod:
  extends: .docker
  stage: build
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - >-
      docker build
      --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --build-arg VERSION="${VERSION}"
      --build-arg VCS_REF="${CI_COMMIT_SHA}"
      -f "${DOCKERFILE_PATH}"
      -t "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
      -t "${CI_REGISTRY_IMAGE}/prod:latest"
      .
    - docker push "${CI_REGISTRY_IMAGE}/prod:${VERSION}"
    - docker push "${CI_REGISTRY_IMAGE}/prod:latest"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
