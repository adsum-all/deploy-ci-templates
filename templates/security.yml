# Reusable security scans (stack agnostic). The including repo defines a
# 'security' stage. Secret scan blocks; image and config scans report.

security:gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  # --verbose so a finding says which rule, which file and which line. Without it
  # the job printed "leaks found: 1" and stopped there: whoever had to act on it
  # could not tell a real key from a documented example, and the only way to find
  # out was to run the scanner by hand. A gate nobody can act on gets bypassed.
  #
  # --redact stays: the value itself never reaches the log, which is the whole point
  # of scanning for it. The report is kept as an artifact so a finding can be read
  # after the log has rotated.
  script:
    - gitleaks detect --source . --no-banner --redact --verbose --exit-code 1 --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks-report.json
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

security:trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners secret,vuln,misconfig --severity HIGH,CRITICAL --exit-code 0 --no-progress .
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  allow_failure: true
