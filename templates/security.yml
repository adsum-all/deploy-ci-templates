# Chaîne DevSecOps partagée ADSUM.
#
# Sept contrôles, chacun conditionné à ce que le dépôt contient réellement. Un dépôt
# de documentation n'exécute que la détection de secrets ; un service Python en
# exécute cinq ; un dépôt d'infrastructure en exécute six.
#
# Politique de sévérité, la même partout et écrite une fois pour toutes :
#
#   CRITICAL et HIGH  arrêtent le pipeline. Une faille exploitable sur un chemin de
#                     production ne se fusionne pas, et l'exception se demande, elle
#                     ne se prend pas en désactivant le contrôle.
#   MEDIUM et LOW     sont rapportées sans bloquer. Les faire bloquer ferait passer
#                     l'équipe son temps à contourner le contrôle plutôt qu'à le lire,
#                     ce qui est la façon dont un garde-fou meurt.
#
# Aucune valeur sensible n'est imprimée. Les scans de secrets tournent avec
# `--redact` : le nom de la règle, le fichier et la ligne suffisent à corriger, et la
# valeur elle-même n'a rien à faire dans un journal que la CI conserve.

variables:
  ADSUM_SEVERITES_BLOQUANTES: "CRITICAL,HIGH"
  ADSUM_TRIVY_VERSION: "0.58.1"

.securite:
  stage: security
  interruptible: true
  # Un contrôle de sécurité qui ne tourne pas doit se voir. Les artefacts sont donc
  # produits même en échec, pour que le rapport soit lisible sans relancer la tâche.
  artifacts:
    when: always
    expire_in: 30 days

# -- 1. Secrets ----------------------------------------------------------------
#
# Le seul contrôle exécuté par TOUS les dépôts, sans exception, y compris ceux qui
# ne contiennent que de la documentation : un jeton se colle aussi bien dans un
# fichier Markdown que dans du code.

security:secrets:
  extends: .securite
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    # Sur une demande de fusion, seul l'écart est scanné : c'est rapide et c'est ce
    # que l'auteur peut encore corriger. Sur la branche par défaut, tout l'historique
    # est scanné, parce qu'un secret introduit puis retiré reste dans l'historique et
    # reste donc compromis.
    - |
      set -eu
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        echo "Analyse de l'écart depuis ${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
        gitleaks detect --source . --no-banner --redact --verbose \
          --log-opts="${CI_MERGE_REQUEST_DIFF_BASE_SHA}..HEAD" \
          --report-format sarif --report-path gitleaks.sarif --exit-code 1
      else
        echo "Analyse de l'historique complet"
        gitleaks detect --source . --no-banner --redact --verbose \
          --report-format sarif --report-path gitleaks.sarif --exit-code 1
      fi
  variables:
    GIT_DEPTH: "0"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [gitleaks.sarif]

# -- 2. Analyse statique du code -----------------------------------------------

security:sast:
  extends: .securite
  image:
    name: returntocorp/semgrep:latest
    entrypoint: [""]
  script:
    # `--config auto` choisit les règles selon les langages détectés. Les règles
    # OWASP et les règles de secrets sont ajoutées explicitement : la sélection
    # automatique les inclut la plupart du temps, et « la plupart du temps » n'est
    # pas une propriété sur laquelle asseoir un contrôle de sécurité.
    - semgrep scan --config auto --config p/owasp-top-ten --config p/secrets
        --error --severity ERROR
        --sarif --output semgrep.sarif
        --metrics off
  artifacts:
    when: always
    expire_in: 30 days
    paths: [semgrep.sarif]
  rules:
    - exists: ['**/*.py', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx']

# -- 3. Dépendances ------------------------------------------------------------

security:dependances:python:
  extends: .securite
  image: python:3.11-slim
  script:
    - pip install --quiet pip-audit cyclonedx-bom
    # pip-audit interroge la base d'avis PyPI. Le code de retour non nul sur
    # vulnérabilité est le comportement voulu : c'est la porte.
    - pip-audit --strict --format json --output pip-audit.json --progress-spinner off
        $( [ -f requirements.txt ] && echo "-r requirements.txt" )
    - cyclonedx-py environment --output-format json --outfile sbom-python.json || true
  artifacts:
    when: always
    expire_in: 30 days
    paths: [pip-audit.json, sbom-python.json]
  rules:
    - exists: [requirements.txt, pyproject.toml]

security:dependances:node:
  extends: .securite
  image: node:20-alpine
  script:
    # `--audit-level=high` aligne npm sur la politique commune : critique et élevée
    # bloquent, le reste est rapporté.
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm audit --audit-level=high --json > npm-audit.json || AUDIT=1
    - npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-node.json || true
    - test -z "${AUDIT:-}" || (echo "Vulnérabilités HIGH ou CRITICAL dans les dépendances"; cat npm-audit.json | head -80; exit 1)
  artifacts:
    when: always
    expire_in: 30 days
    paths: [npm-audit.json, sbom-node.json]
  rules:
    - exists: [package-lock.json]

# -- 4. Licences ---------------------------------------------------------------
#
# Une licence copyleft forte dans une dépendance d'un produit vendu est un problème
# juridique, pas technique, et il se découvre toujours trop tard. Rapporté sans
# bloquer : la décision appartient au propriétaire, le contrôle lui donne la liste.

security:licences:
  extends: .securite
  image: python:3.11-slim
  allow_failure: true
  script:
    - pip install --quiet pip-licenses
    - pip-licenses --format=json --output-file licences-python.json
    - |
      echo "Licences à examiner (copyleft fort) :"
      grep -iE '"License": "(GPL|AGPL|SSPL|CC-BY-NC)' licences-python.json || echo "  aucune"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [licences-python.json]
  rules:
    - exists: [requirements.txt, pyproject.toml]

# -- 5. Système de fichiers et images ------------------------------------------

security:trivy-fs:
  extends: .securite
  image:
    name: aquasec/trivy:${ADSUM_TRIVY_VERSION}
    entrypoint: [""]
  script:
    - trivy fs --no-progress --scanners vuln,secret,misconfig
        --severity "$ADSUM_SEVERITES_BLOQUANTES" --exit-code 1
        --format table .
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID'

security:image:
  extends: .securite
  image:
    name: aquasec/trivy:${ADSUM_TRIVY_VERSION}
    entrypoint: [""]
  script:
    # Ne tourne que si une image a réellement été construite et publiée par l'étape
    # build. Scanner une image absente rendrait un vert qui ne signifie rien.
    - trivy image --no-progress --severity "$ADSUM_SEVERITES_BLOQUANTES"
        --exit-code 1 --format table "$ADSUM_IMAGE_A_SCANNER"
  rules:
    - if: '$ADSUM_IMAGE_A_SCANNER'

# -- 6. Infrastructure as code --------------------------------------------------

security:iac:
  extends: .securite
  image:
    name: aquasec/trivy:${ADSUM_TRIVY_VERSION}
    entrypoint: [""]
  script:
    - trivy config --no-progress --severity "$ADSUM_SEVERITES_BLOQUANTES"
        --exit-code 1 --format table .
  rules:
    - exists: ['**/*.tf', '**/Dockerfile', '**/*.yaml', '**/*.yml', '**/Chart.yaml']

# -- 7. Journal des exceptions --------------------------------------------------
#
# Une exception de sécurité sans date de fin devient une politique. Cette tâche
# refuse une exception périmée, ce qui oblige à la renouveler consciemment ou à
# corriger la cause.

security:exceptions:
  extends: .securite
  image: alpine:3.20
  script:
    - |
      set -eu
      F="docs/security/exceptions.md"
      [ -f "$F" ] || { echo "Aucune exception déclarée."; exit 0; }
      AUJOURD_HUI=$(date +%Y-%m-%d)
      PERIMEES=$(grep -oE 'expire: [0-9]{4}-[0-9]{2}-[0-9]{2}' "$F" \
                 | awk -v d="$AUJOURD_HUI" '{ if ($2 < d) print $2 }')
      if [ -n "$PERIMEES" ]; then
        echo "FAIL: exceptions de sécurité périmées dans $F :"; echo "$PERIMEES"; exit 1
      fi
      echo "Toutes les exceptions déclarées sont encore valides."
  rules:
    - exists: [docs/security/exceptions.md]
