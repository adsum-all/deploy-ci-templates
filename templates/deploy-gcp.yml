# Reusable deploy to a GCP VM: pull the prod image from the registry and run it.
# The including repo defines a 'deploy' stage. Group CI/CD variables required
# (protected + masked): GCP_SA_KEY, GCP_PROJECT, GCP_ZONE, ADSUM_VM_NAME, and the
# service runtime env. Manual trigger on a semantic version tag (deliberate release).

deploy:gcp:
  stage: deploy
  image: google/cloud-sdk:slim
  variables:
    APP_NAME: "adsum-api"
    APP_PORT: "8080"
  before_script:
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/sa.json 2>/dev/null || echo "$GCP_SA_KEY" > /tmp/sa.json
    - gcloud auth activate-service-account --key-file=/tmp/sa.json
    - gcloud config set project "$GCP_PROJECT"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - IMAGE="${CI_REGISTRY_IMAGE}/prod:${VERSION}"
    - >-
      gcloud compute ssh "$ADSUM_VM_NAME" --zone "$GCP_ZONE" --tunnel-through-iap --command
      "echo '$CI_REGISTRY_PASSWORD' | sudo docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
       sudo docker pull '$IMAGE' &&
       sudo docker rm -f '$APP_NAME' 2>/dev/null || true &&
       sudo docker run -d --name '$APP_NAME' --restart unless-stopped -p ${APP_PORT}:${APP_PORT}
         -e ADSUM_DATABASE_URL='$ADSUM_DATABASE_URL'
         -e ADSUM_JWT_SECRET='$ADSUM_JWT_SECRET'
         -e ADSUM_CORS_ORIGINS='$ADSUM_CORS_ORIGINS'
         '$IMAGE' &&
       sudo docker image prune -f"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
