# Point d'entrée CI pour un service Python ADSUM (FastAPI, ouvriers, passerelle).
#
# Usage, dans le .gitlab-ci.yml du dépôt :
#
#   include:
#     - project: 'sr-media-ai/adsum/deployment/ci-templates'
#       ref: main
#       file: '/templates/stack-python-service.yml'

# Inclusions locales : elles se résolvent dans CE dépôt, à la révision que le
# consommateur a demandée par son propre « ref ». Les pointer sur « main » figeait le
# socle à la version publiée, si bien qu'un gabarit et son socle pouvaient diverger
# d'une étape, ce que GitLab signale par « chosen stage does not exist ».
include:
  - local: '/templates/base.yml'
  - local: '/templates/security.yml'

.python:
  image: python:3.11-slim
  interruptible: true
  cache:
    key:
      files: [requirements.txt, pyproject.toml]
    paths: [.cache/pip]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - python -m pip install --quiet --upgrade pip
    - if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi

validate:configuration:
  stage: validate
  image: python:3.11-slim
  script:
    # Les fichiers de configuration se cassent silencieusement : un TOML invalide
    # ne se voit qu'au démarrage, c'est-à-dire en production si personne ne l'a lu.
    - |
      python - <<'PY'
      import sys, tomllib, pathlib
      for chemin in pathlib.Path(".").rglob("pyproject.toml"):
          if ".venv" in chemin.parts:
              continue
          try:
              tomllib.loads(chemin.read_text(encoding="utf-8"))
              print(f"ok   {chemin}")
          except Exception as e:
              print(f"FAIL {chemin} : {e}"); sys.exit(1)
      PY
  rules:
    - exists: [pyproject.toml]

quality:ruff:
  extends: .python
  stage: quality
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check .
    - ruff format --check . || echo "Format non applique, non bloquant pour l'instant"
  rules:
    - exists: [pyproject.toml, requirements.txt]

quality:types:
  extends: .python
  stage: quality
  # Non bloquant tant que l'annotation n'est pas complète sur tout le service.
  # Bloquer d'emblée sur une base existante produit une porte que l'on contourne
  # dès le premier jour, ce qui est pire que pas de porte du tout.
  allow_failure: true
  script:
    - pip install --quiet mypy
    - mypy --ignore-missing-imports --no-error-summary . || true
  rules:
    - exists: [pyproject.toml]

test:pytest:
  extends: .python
  stage: test
  timeout: 60 minutes
  script:
    - pip install --quiet pytest pytest-cov
    - pytest -q --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - exists: ['tests/**/*.py']
