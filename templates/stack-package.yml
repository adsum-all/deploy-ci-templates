# Point d'entrée CI pour un paquet partagé ADSUM (core, qr, tokens, ui-web, ui-native).
#
# Un paquet partagé n'est pas une application : il n'a ni build à déployer ni
# environnement, mais il a une contrainte que les applications n'ont pas. Ce qu'il
# publie devient une dépendance de plusieurs produits, et une version cassée se
# propage sans qu'aucun de ces produits n'ait rien changé.
#
# D'où les deux exigences propres à ce gabarit : une version qui ne se republie
# jamais sous le même numéro, et une publication qui ne part que d'une étiquette.
#
# État réel au 20 août 2026 : les cinq paquets ADSUM sont **vides**, ils ne
# contiennent que .gitignore, LICENSE et README. Ce gabarit les attend plutôt qu'il
# ne décrit ce qu'ils font, et la tâche de publication ne se déclenche donc jamais
# tant qu'aucun package.json n'y figure.

# Inclusions locales : elles se résolvent dans ce dépôt, à la révision que le
# consommateur demande par son propre « ref ».
include:
  - local: '/templates/base.yml'
  - local: '/templates/security.yml'

.paquet:
  image: node:20-alpine
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-fund --no-audit

validate:version:
  stage: validate
  image: node:20-alpine
  script:
    # Republier une version déjà publiée est la façon la plus discrète de casser un
    # consommateur : son verrou pointe sur un numéro dont le contenu a changé.
    - |
      set -eu
      nom=$(node -p "require('./package.json').name")
      version=$(node -p "require('./package.json').version")
      echo "Paquet $nom, version $version"
      if npm view "$nom@$version" version >/dev/null 2>&1; then
        echo "FAIL la version $version de $nom est déjà publiée. Incrémenter avant de fusionner."
        exit 1
      fi
      echo "Version libre."
  rules:
    - exists: [package.json]

quality:lint:
  extends: .paquet
  stage: quality
  script:
    - npm run lint --if-present
  rules:
    - exists: [package.json]

test:unitaires:
  extends: .paquet
  stage: test
  script:
    - npm test --if-present
  rules:
    - exists: [package.json]

build:paquet:
  extends: .paquet
  stage: build
  script:
    - npm run build --if-present
  artifacts:
    expire_in: 7 days
    paths: [dist]
  rules:
    - exists: [package.json]

package:publier:
  extends: .paquet
  stage: package
  script:
    # Le registre est celui du projet GitLab. Le jeton de tâche suffit : aucun
    # secret durable n'est nécessaire pour publier chez soi.
    - |
      set -eu
      printf '@%s:registry=%s/api/v4/projects/%s/packages/npm/\n' \
        "$CI_PROJECT_ROOT_NAMESPACE" "$CI_SERVER_URL" "$CI_PROJECT_ID" > .npmrc
      printf '//%s/api/v4/projects/%s/packages/npm/:_authToken=%s\n' \
        "$CI_SERVER_HOST" "$CI_PROJECT_ID" "$CI_JOB_TOKEN" >> .npmrc
    - npm publish
  # Uniquement depuis une étiquette. Publier depuis une branche produit des versions
  # dont personne ne sait à quel état du code elles correspondent.
  rules:
    - if: '$CI_COMMIT_TAG'
      exists: [package.json]
