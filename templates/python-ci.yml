# Reusable Python validate and test stages for the structured pipeline
# (stages: validate, test, security, build, deploy). Includes the Constitution
# audit (I1 to I11) and ruff, pytest, and pip-audit.

validate:constitution:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache grep findutils coreutils >/dev/null
  script:
    - |
      set -eu
      EM=$(printf '\xe2\x80\x94'); EN=$(printf '\xe2\x80\x93')
      echo "Em-dash and en-dash check"
      if grep -rlF "$EM" --exclude-dir=.git . 2>/dev/null; then echo "FAIL em-dash"; exit 1; fi
      if grep -rlF "$EN" --exclude-dir=.git . 2>/dev/null; then echo "FAIL en-dash"; exit 1; fi
      echo "Mock or fake data check"
      if grep -rniE "(mock|fake|dummy)[_-]?(data|user|users)|faker\\b" \
           --include='*.py' --exclude-dir=.git --exclude-dir=tests . 2>/dev/null; then
        echo "FAIL possible mock data outside tests"; exit 1; fi
      echo "File size check (max 500 lines)"
      EXC="docs/quality/file-size-exceptions.md"
      BIG=$(find . -type f -name '*.py' -not -path '*/.git/*' -not -path '*/.venv/*' \
             -exec wc -l {} + 2>/dev/null | awk '$1>500 && $2!="total"{print $2}' \
           | while read -r f; do
               base=${f#./}
               if [ -f "$EXC" ] && grep -qF "$base" "$EXC"; then :; else echo "$f"; fi
             done)
      if [ -n "$BIG" ]; then echo "FAIL over 500 lines (not documented in $EXC):"; echo "$BIG"; exit 1; fi
      echo "Constitution audit passed"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

validate:lint:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install --quiet ruff
    - ruff check .
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

test:pytest:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --quiet -r requirements.txt
    - pip install --quiet pytest
    - pytest -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

security:pip-audit:
  stage: security
  image: python:3.11-slim
  script:
    - pip install --quiet pip-audit
    - pip-audit -r requirements.txt --strict || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  allow_failure: true
